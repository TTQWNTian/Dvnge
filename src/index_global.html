<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Dvnge</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            -ms-overflow-style: none;
            transition: .3s;
        }
        
        html, body {
            height: 100dvh;
            background: url('photo/background.png') center/cover no-repeat fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }
        
        .control-component {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 10%;
            color: #111;
            background: linear-gradient(to right, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 100%);
        }
        
        h1 {
            margin: 0 0 2em 0;
            font-size: 3em;
            font-weight: 400;
        }
        
        button {
            margin: .35em 0;
            font-size: 1.3em;
            font-weight: 300;
            color: #111;
            text-decoration: none;
            border: none;
            background: none;
            cursor: pointer;
        }
        
        button:hover {
            font-weight: 600;
        }
        
        /* General Overlay Style */
        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
            z-index: 200;
        }
        
        #overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .overlay-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            padding: 30px 40px;
            border: 1px solid #DDDDDD;
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        
        .overlay-close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #111;
        }
        
        .overlay-item {
            margin: 10px 0;
            padding: 10px 15px;
            background: #f7f7f7;
            border: 1px solid #DDDDDD;
            border-radius: 4px;
            cursor: pointer;
            transition: background .2s;
        }
        
        .overlay-item:hover {
            background: #EEEEEE;
        }
        
        .overlay-item.empty {
            opacity: .4;
            cursor: default;
        }
        
        .overlay-item.empty:hover {
            background: #f7f7f7;
        }
        
        .overlay-item.now {
            background: #e0e0e0;
        }
        
        .hidden {
            display: none;
        }
        
        @media (min-width: 1028px) {
            h1 {
                font-size: 6em;
            }
            button {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="control-component">
        <h1 id="title">Game Title</h1>
        <nav>
            <button id="startButton" onclick="window.location.href='game.html'">Start</button><br>
            <button id="loadSaveButton">Load Save</button><br>
            <button id="languageButton">Language</button>
        </nav>
    </div>
    
    <!-- General Overlay -->
    <div id="overlay" class="hidden">
        <div class="overlay-card">
            <span class="overlay-close-button">×</span>
            <h3 id="overlay-title" style="margin-bottom: 15px;">Load Save</h3>
            <div id="overlay-content"></div>
        </div>
    </div>
    
    <script src="js/settings.js"></script>
    <script>
        let lang = localStorage.getItem(window.settings.key.Language) || 'zh';
        
        const display = {
            'zh': {
                'Game Title': '游戏名',
                'Start': '开始游戏',
                'Load Save': '读取存档',
                'Language': '语言',
                'Choose Language': '选择语言',
                'Auto Save': '自动存档',
                'Manual Save': '手动存档',
                'Empty': '空存档',
                'Corrupted Data': '数据损坏',
                'No Data': '无数据'
            },
            'en': {
                'Game Title': 'Game Title',
                'Start': 'Start',
                'Load Save': 'Load',
                'Language': 'Language',
                'Choose Language': 'Select Language',
                'Auto Save': 'Auto Save',
                'Manual Save': 'Manual Save',
                'Empty': 'Empty',
                'Corrupted Data': 'Corrupted Data',
                'No Data': 'No Data'
            },
            'ja': {
                'Game Title': 'Game Title',
                'Start': 'ゲーム開始',
                'Load Save': 'ロード',
                'Language': '言語',
                'Choose Language': '言語選択',
                'Auto Save': 'オートセーブ',
                'Manual Save': 'セーブ',
                'Empty': '空き',
                'Corrupted Data': 'データ破損',
                'No Data': 'データなし'
            }
        };

        function updateDisplay() {
            const text = display[lang] || display['zh'];
            document.getElementById('title').textContent = text['Game Title'];
            document.getElementById('startButton').textContent = text['Start'];
            document.getElementById('loadSaveButton').textContent = text['Load Save'];
            document.getElementById('languageButton').textContent = text['Language'];
        }
        
        function switchLanguage(languageCode) {
            lang = languageCode;
            localStorage.setItem(window.settings.key.Language, languageCode);
            updateDisplay();
        }
        
        function jumpToGame(slot) {
            location.href = 'game.html?存档=' + slot;
        }
        
        function displayLoadSaveOverlay() {
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlay-title');
            const content = document.getElementById('overlay-content');
            const text = display[lang] || display['zh'];
            const key = window.settings.key;
            const maxSlots = window.settings.maxSlots || 2;
            
            title.textContent = text['Load Save'];
            content.innerHTML = '';
            
            const auto = localStorage.getItem(key.autoSave);
            const autoBlock = document.createElement('div');
            autoBlock.className = 'overlay-item';
            if (auto) {
                try {
                    const d = JSON.parse(auto);
                    autoBlock.innerHTML = `<strong>${text['Auto Save']}</strong><p style="font-size:0.8em;margin-top:5px;">${d.chapter || 'Unknown'} · ${d.time || 'Unknown'}</p>`;
                    autoBlock.onclick = () => jumpToGame('auto');
                } catch {
                    autoBlock.innerHTML = `<strong>${text['Auto Save']}</strong><p style="font-size:0.8em;margin-top:5px;">${text['Corrupted Data']}</p>`;
                }
            } else {
                autoBlock.classList.add('empty');
                autoBlock.innerHTML = `<strong>${text['Auto Save']}</strong><p style="font-size:0.8em;margin-top:5px;">${text['No Data']}</p>`;
            }
            content.appendChild(autoBlock);
            
            for (let i = 1; i <= maxSlots; i++) {
                const key = `${key.manualSavePrefix}${i}`;
                const data = localStorage.getItem(key);
                const slotBlock = document.createElement('div');
                slotBlock.className = 'overlay-item';
                if (data) {
                    try {
                        const d = JSON.parse(data);
                        slotBlock.innerHTML = `<strong>${text['Manual Save']} ${i}</strong><p style="font-size:0.8em;margin-top:5px;">${d.chapter || 'Unknown'} · ${d.time || 'Unknown'}</p>`;
                        slotBlock.onclick = () => jumpToGame(i);
                    } catch {
                        slotBlock.innerHTML = `<strong>${text['Manual Save']} ${i}</strong><p style="font-size:0.8em;margin-top:5px;">${text['Corrupted Data']}</p>`;
                    }
                } else {
                    slotBlock.classList.add('empty');
                    slotBlock.innerHTML = `<strong>${text['Manual Save']} ${i}</strong><p style="font-size:0.8em;margin-top:5px;">${text['Empty']}</p>`;
                }
                content.appendChild(slotBlock);
            }
            
            overlay.classList.add('show');
        }
        
        function displayLanguageOptions() {
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlay-title');
            const content = document.getElementById('overlay-content');
            const text = display[lang] || display['zh'];
            
            title.textContent = text['Choose Language'];
            content.innerHTML = '';
            
            for (const [code, name] of Object.entries(window.settings.languageConfig.languageList)) {
                const option = document.createElement('div');
                option.className = 'overlay-item';
                if (code === lang) {
                    option.classList.add('now');
                }
                option.innerHTML = `<strong>${name}</strong>`;
                option.onclick = () => {
                    switchLanguage(code);
                    overlay.classList.remove('show');
                };
                content.appendChild(option);
            }
            
            overlay.classList.add('show');
        }
        
        function closeOverlay() {
            document.getElementById('overlay').classList.remove('show');
        }
        
        document.getElementById('loadSaveButton').onclick = displayLoadSaveOverlay;
        document.getElementById('languageButton').onclick = displayLanguageOptions;
        document.querySelector('.overlay-close-button').onclick = closeOverlay;
        
        document.getElementById('overlay').onclick = (e) => {
            if (e.target === document.getElementById('overlay')) {
                closeOverlay();
            }
        };
        
        updateDisplay();
    </script>
</body>
</html>
