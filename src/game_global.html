<!--Dvnge Global Version V1.0.0-->
<!--Game Entrance-->
<!DOCTYPE html>
<html>

<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Dvnge Visual Novel</title>
        <link rel="stylesheet_moddify" href="css/style.css">
        <link rel="stylesheet" href="css/anime.css">
</head>
    
<body>
    <!--Background Container-->
    <div id="background-container" class="background-container"></div>
    
    <!--Title Container-->
    <div id="title-container" class="title-container-hide"></div>

    <!--Tachie Container-->
    <img id="left-tachie" class="tachie">
    <img id="middle-tachie" class="tachie">
    <img id="right-tachie" class="tachie">

    <!--Main Page-->
    <div class="main-page">
        <div id="dialog-container">
            <div id="left-avator-container" class="avator-container-hide"></div>
            <div id="dialog-box">
                <div id="toolbar">
                    <button id="fast-forward" onclick="fastForward(event)">Fast Forward</button>
                    <button id="hide-dialog" onclick="hideDialog()">Hide</button>
                </div>
                <div class="character"></div>
                <div class="content"></div>
                <div class="option"></div>
            </div>
            <div id="right-avator" class="avator-hide"></div>
        </div>
    </div>

    <!--Button-->
    <button class="save" id="save" onclick="openSavePage()">
        <svg width="24" height="24" viewBox="0 0 448 512"><path fill="currentColor" d="M64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-242.7c0-17-6.7-33.3-18.7-45.3L352 50.7C340 38.7 323.7 32 306.7 32L64 32zm32 96c0-17.7 14.3-32 32-32l160 0c17.7 0 32 14.3 32 32l0 64c0 17.7-14.3 32-32 32l-160 0c-17.7 0-32-14.3-32-32l0-64zM224 288a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/></svg>
    </button>
    <button class="backup-hide" id="backup">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor"><path d="M6.78 1.97a.75.75 0 0 1 0 1.06L3.81 6h6.44A4.75 4.75 0 0 1 15 10.75v2.5a.75.75 0 0 1-1.5 0v-2.5a3.25 3.25 0 0 0-3.25-3.25H3.81l2.97 2.97a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L1.47 7.28a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"/></svg>
    </button>
    <button class="custom-button" onclick="costomButton()">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor"><path d="M7.53 1.282a.5.5 0 0 1 .94 0l.478 1.306a7.492 7.492 0 0 0 4.464 4.464l1.305.478a.5.5 0 0 1 0 .94l-1.305.478a7.492 7.492 0 0 0-4.464 4.464l-.478 1.305a.5.5 0 0 1-.94 0l-.478-1.305a7.492 7.492 0 0 0-4.464-4.464L1.282 8.47a.5.5 0 0 1 0-.94l1.306-.478a7.492 7.492 0 0 0 4.464-4.464Z"/></svg>
    </button>

    <!--Save Page-->
    <div id="save-page" class="hidden">
        <div class="title">Manage Save Data</div>
        <div class="save-lists">
            <div class="save-slots" data-slot="auto"></div>
            <div class="save-slots" data-slot="1" onclick="gameSave(1)"></div>
            <div class="save-slots" data-slot="2" onclick="gameSave(2)"></div>
        </div>
        <div class="save-action">
        <button id="export-save" onclick="exportSave()">Export Save Data</button>
        <button id="import-save" onclick="document.getElementById('import-file').click()">Import Save Data</button>
        </div
    <input type="file" id="import-file" class="hidden" accept=".json" onchange="importSave()">
    <button class="close" onclick="closeSavePage()"></button>
    </div>

    <audio id="background-music" class="hidden"></audio>

    <!--Only Load JS File-->
    <script src="js/settings.js"></script>
    <scirpt src="js/TTQ_engine.js"></scirpt>
    <script src="js/save.js"></script>
    <script src="js/custom.js"></script>
    </body>
</html>
